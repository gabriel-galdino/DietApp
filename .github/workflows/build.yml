name: Build Linux
on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WXWIDGETS_VERSION: "3.2.4+dfsg-4build1"

    steps:
      - uses: actions/checkout@v4
        with:
           submodules: recursive  

      - name: Install wxWidgets
        run: |
          sudo apt update
          sudo apt install -y \
              libwxgtk3.2-dev=${{ env.WXWIDGETS_VERSION }} \
              libwxgtk3.2-1t64=${{ env.WXWIDGETS_VERSION }} \
              libwxbase3.2-1t64=${{ env.WXWIDGETS_VERSION }} \
              libwxsqlite3-3.2-0t64 \
              libwxsqlite3-3.2-dev \
              libgtk-3-dev \
              cmake \
              catch2 \
              build-essential \
              xvfb
              
          wx-config --version-full
          dpkg -l libwxgtk3.2-1t64 | grep ${{ env.WXWIDGETS_VERSION }}

      - name: Configure build
        run: |
          cmake -B build -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Compile
        run: |
          cmake --build build

      - name: Run Tests
        run: |
          cd build && xvfb-run --auto-servernum -- ./test/presentation_test